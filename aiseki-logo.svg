<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120">
  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#C9A84C"/>
      <stop offset="50%" style="stop-color:#D4AF37"/>
      <stop offset="100%" style="stop-color:#C9A84C"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="400" height="120" fill="none"/>
  <!-- Main text -->
  <text x="200" y="72" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="64" font-weight="700" letter-spacing="12" fill="url(#gold)">AISEKI</text>
  <!-- Subtle tagline -->
  <text x="200" y="100" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="400" letter-spacing="6" fill="#8a7a5a">GROUP MATCHING</text>
  <!-- Accent line left -->
  <line x1="40" y1="82" x2="120" y2="82" stroke="#D4AF37" stroke-width="0.5" opacity="0.6"/>
  <!-- Accent line right -->
  <line x1="280" y1="82" x2="360" y2="82" stroke="#D4AF37" stroke-width="0.5" opacity="0.6"/>
</svg>